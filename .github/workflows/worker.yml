name: Lexora Research Worker

on:
  schedule:
    # A cada 5 minutos. GitHub Actions nao garante precisao em intervalos
    # menores que esse (pode atrasar sob carga alta da plataforma).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # permite rodar manualmente pelo botao "Run workflow"

jobs:
  process-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Processar fila de pesquisas
        run: python worker.py
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
